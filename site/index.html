<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site in Progress</title>
<meta name="description" content="This site is in progress. Something new is on the way.">
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    color:#e8e4d8;
    background:radial-gradient(120% 90% at 50% 10%,#1b2f2a 0%,#12211e 45%,#0b1513 100%);
  }
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .mono{font-family:'Courier New',Courier,monospace}
  .dot{
    display:inline-block;width:9px;height:9px;border-radius:50%;
    background:#c9a84c;margin-right:10px;vertical-align:2px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .rule{
    width:64px;height:2px;margin:28px auto;border:0;
    background:linear-gradient(90deg,transparent,#c9a84c,transparent);
  }
</style>
</head>
<body>
  <main style="position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px">

    <div class="mono" style="font-size:12px;letter-spacing:6px;color:#8fae9f">
      <span class="dot"></span>UNDER CONSTRUCTION
    </div>

    <h1 style="font-size:clamp(44px,9vw,88px);line-height:1.05;margin:22px 0 0;color:#f2eddc;text-shadow:0 4px 32px rgba(0,0,0,.45)">
      Site in Progress
    </h1>

    <hr class="rule">

    <p style="max-width:520px;margin:0;font-size:clamp(16px,2.2vw,19px);line-height:1.8;color:#b9c9be">
      Something new is being built here. Check back soon.
    </p>

    <div class="mono" id="host" style="position:absolute;bottom:24px;font-size:11px;letter-spacing:3px;color:#5c7568"></div>
    <script>
      document.getElementById('host').textContent =
        (location.hostname || 'cashconsults.com').toUpperCase();
    </script>
  </main>
</body>
</html>
