name: Clean up PR preview

# Delete the screenshots branch that check.yml pushed for this PR.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the preview screenshots branch
        run: |
          curl -sf -X DELETE \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/pr-preview-screens/${{ github.event.pull_request.number }}" \
            || echo "No preview branch to delete."
